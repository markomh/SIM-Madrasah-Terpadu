server {
    listen 80;
    index index.php index.html;
    root /var/www/public;

    # ================================================================
    # CORS Preflight — Dijawab langsung oleh Nginx tanpa menyentuh PHP-FPM.
    # Mengeliminasi lonjakan request OPTIONS yang menyebabkan
    # PHP-FPM saturasi dan ERR_EMPTY_RESPONSE pada WSL2/Docker.
    # ================================================================

    location / {
        # Tangani OPTIONS preflight langsung di Nginx
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Accept, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\.ht {
        deny all;
    }

    access_log /var/log/nginx/sim_madrasah_access.log;
    error_log /var/log/nginx/sim_madrasah_error.log;
}
